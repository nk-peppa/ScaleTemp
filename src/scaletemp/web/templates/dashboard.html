<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScaleTemp HX711</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot"></span><div><b>ScaleTemp</b><small id="deviceInfo">HX711 + CZL611N + Orange Pi Zero 3 · IP {{ current_ip }}</small></div></div>
    <nav class="actions">
      <button id="langBtn">中文 / ENG</button>
      <button onclick="location.reload()" data-i18n="refresh">刷新页面</button>
      <button id="tareBtn" data-i18n="tare">去皮</button>
      <a class="button primary" href="/experiments" data-i18n="experiment">实验数据测算</a>
    </nav>
  </header>
  <main class="layout">
    <section class="left-grid">
      <article class="card hero-card">
        <div class="card-title"><span data-i18n="weightCurve">实时重量曲线</span><strong id="weightNow">-- g</strong></div>
        <canvas id="weightChart"></canvas>
      </article>
      <article class="card">
        <div class="card-title"><span data-i18n="rawFilter">原始 / 滤波数据曲线</span></div>
        <canvas id="rawChart"></canvas>
      </article>
      <article class="card">
        <div class="card-title"><span data-i18n="conversion">实时原始数据-克重转换曲线</span></div>
        <canvas id="conversionChart"></canvas>
      </article>
    </section>
    <aside class="right-panel">
      <article class="card status-card">
        <span data-i18n="sensorStatus">状态</span>
        <strong id="stableBadge" class="badge unstable">UNSTABLE</strong>
        <p id="rawNow">Raw: --</p>
        <p id="sensorMode" class="muted">Sensor: --</p>
      </article>
      <article class="card">
        <h3 data-i18n="calibration">校准</h3>
        <p class="muted" data-i18n="calibrationHelp">输入当前砝码克重，系统将保存当前稳定原始值作为校准点。</p>
        <form id="calibrationForm" class="inline-form">
          <input type="number" step="0.01" name="grams" placeholder="g" required />
          <button data-i18n="savePoint">保存校准点</button>
        </form>
        <button id="clearCalibration" type="button" class="danger-button">清空校准点</button>
        <div id="calibrationCards" class="calibration-cards"></div>
      </article>
      <article class="card">
        <h3 data-i18n="filterStrength">滤波强度</h3>
        <input id="filterSlider" type="range" min="0" max="2" step="0.01" value="0.65" />
        <div class="scale"><span>Fast</span><span>Max Smooth</span></div>
        <label class="slider-field">滤波窗口限制 / Filter window
          <input id="filterWindowSlider" type="range" min="0" max="10000" step="10" value="10000" />
          <input id="filterWindowInput" type="number" min="0" max="10000" step="10" value="10000" />
        </label>
      </article>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
